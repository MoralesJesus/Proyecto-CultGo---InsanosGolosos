    <p>Encuentra eventos musicales en Oaxaca de Juarez</p>

      style="margin-bottom: 20px; padding: 10px; background-color: #4CAF50; color: white; border: none; cursor: pointer;"

    <Buscador valor={busqueda} onCambio={setBusqueda} />
